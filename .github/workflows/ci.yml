name: CI

on:
  push:
    branches: [main, feat/backend-foundation]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package.json
      - run: npm install
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://petrecord:petrecord@localhost:5432/petrecord?schema=public
      - run: npm test
      - run: npm run build
      - run: docker build -t universal-pet-health-record-backend .
